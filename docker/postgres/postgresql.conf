# =================================================
# DUOCAFE - PostgreSQL 15 tuning
# VPS: 8 vCPU / 24GB RAM
# =================================================

# Conexiones
max_connections = 200

# Memoria
shared_buffers = 2GB
effective_cache_size = 6GB
work_mem = 32MB
maintenance_work_mem = 512MB
wal_buffers = 64MB

# WAL / Replication (para PITR)
wal_level = replica
archive_mode = on
archive_command = 'cp %p /var/lib/postgresql/wal_archive/%f'
max_wal_size = 2GB
min_wal_size = 256MB
checkpoint_completion_target = 0.9

# Query planner
random_page_cost = 1.1
effective_io_concurrency = 200
default_statistics_target = 100

# Logging
log_min_duration_statement = 1000
log_checkpoints = on
log_connections = off
log_lock_waits = on
log_temp_files = 0

# Autovacuum
autovacuum_vacuum_cost_delay = 2ms

# Locale
lc_messages = 'en_US.UTF-8'
lc_monetary = 'en_US.UTF-8'
lc_numeric = 'en_US.UTF-8'
lc_time = 'en_US.UTF-8'

listen_addresses = '*'
