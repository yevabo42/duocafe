name: Deploy → PRODUCTION

# Solo desde main, requiere aprobacion manual (GitHub Environment Protection)
on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_API: ghcr.io/${{ github.repository_owner }}/duocafe-api
  IMAGE_WEB: ghcr.io/${{ github.repository_owner }}/duocafe-web

jobs:
  # ─────────────────────────────────────────────────────────────
  # 1. Unit tests (validacion final antes de produccion)
  # ─────────────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: pnpm/action-setup@v4
        with:
          version: '10.30.1'

      - name: Get pnpm store
        id: pnpm-cache
        run: echo "dir=$(pnpm store path)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.dir }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @duocafe/shared test
      - run: pnpm --filter @duocafe/api test

  # ─────────────────────────────────────────────────────────────
  # 2. Build imagenes de produccion (paralelo)
  # ─────────────────────────────────────────────────────────────
  build-api:
    name: Build API Image
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Generar tag
        id: tag
        run: echo "image_tag=sha-$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE_API }}
          tags: |
            type=raw,value=${{ steps.tag.outputs.image_tag }}
            type=raw,value=production-latest
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=api-production
          cache-to: type=gha,scope=api-production,mode=max
          platforms: linux/amd64

  build-web:
    name: Build Web Image
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Generar tag
        id: tag
        run: echo "image_tag=sha-$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE_WEB }}
          tags: |
            type=raw,value=${{ steps.tag.outputs.image_tag }}
            type=raw,value=production-latest
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=web-production
          cache-to: type=gha,scope=web-production,mode=max
          platforms: linux/amd64
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.PROD_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.PROD_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_API_URL=${{ secrets.PROD_API_URL }}
            NEXT_BUILD_STANDALONE=true

  # ─────────────────────────────────────────────────────────────
  # 3. Deploy PRODUCTION
  #    Requiere aprobacion manual en GitHub → Settings → Environments → production
  # ─────────────────────────────────────────────────────────────
  deploy:
    name: Deploy PRODUCTION
    runs-on: ubuntu-latest
    needs: [build-api, build-web]
    environment: production   # Configurar "Required reviewers" en GitHub Settings

    steps:
      - uses: actions/checkout@v4

      - name: Sincronizar archivos de configuracion al VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: "envs/production/docker-compose.yml"
          target: /opt/duocafe
          overwrite: true

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          timeout: 15m
          script: |
            set -euo pipefail

            echo "${{ secrets.GHCR_TOKEN }}" | \
              docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            IMAGE_TAG="sha-$(echo ${{ github.sha }} | cut -c1-7)" \
            GHCR_OWNER="${{ github.repository_owner }}" \
            DEPLOY_DIR="/opt/duocafe" \
              bash /opt/duocafe/scripts/deploy-env.sh production

      - name: Resultado del deploy
        if: always()
        run: |
          echo "Deploy PRODUCTION: ${{ job.status }}"
          echo "Version: sha-$(echo ${{ github.sha }} | cut -c1-7)"
          echo "URL: http://5.189.162.47.nip.io"
