version: "3.8"

# =================================================
# DUOCAFE - Overrides de Desarrollo
# Usar: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
# =================================================

services:

  # En desarrollo: Traefik usa HTTP simple (sin SSL)
  traefik:
    command:
      - "--api.dashboard=true"
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=duocafe-network"
      - "--entrypoints.web.address=:80"
      - "--log.level=DEBUG"
    ports:
      - "80:80"
      - "8080:8080"   # Dashboard accesible en http://localhost:8080

  # Exponer PostgreSQL para conectar con un cliente local (DBeaver, TablePlus, etc.)
  supabase-db:
    ports:
      - "5432:5432"

  # Exponer PgBouncer
  pgbouncer:
    ports:
      - "6543:6543"

  # Supabase Auth accesible directamente
  supabase-auth:
    ports:
      - "9999:9999"
    environment:
      # En desarrollo: autoconfirmar emails para agilizar testing
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      # Permitir localhost como URL de retorno
      GOTRUE_URI_ALLOW_LIST: "http://localhost:3001,http://localhost:3000"
      API_EXTERNAL_URL: "http://localhost:8000"
      GOTRUE_SITE_URL: "http://localhost:3001"
      # SMTP: usar Inbucket (email catcher local)
      GOTRUE_SMTP_HOST: inbucket
      GOTRUE_SMTP_PORT: 2500
      GOTRUE_SMTP_USER: ""
      GOTRUE_SMTP_PASS: ""
      GOTRUE_SMTP_ADMIN_EMAIL: "noreply@duocafe.local"

  # Inbucket: receptor de emails en desarrollo (no necesita SMTP real)
  inbucket:
    image: inbucket/inbucket:3.0.4
    container_name: duocafe-inbucket
    expose:
      - "2500"   # SMTP
    ports:
      - "9000:9000"   # Web UI para ver emails: http://localhost:9000
      - "1100:1100"   # POP3
    networks:
      - duocafe-network

  supabase-rest:
    ports:
      - "3001:3000"   # PostgREST accesible en :3001 para testing

  supabase-kong:
    ports:
      - "8000:8000"   # Supabase API Gateway: http://localhost:8000
    labels:
      - "traefik.enable=false"   # En dev no usar Traefik para Kong

  supabase-studio:
    ports:
      - "54323:3000"   # Supabase Studio: http://localhost:54323
    labels:
      - "traefik.enable=false"

  # Exponer Redis directamente para debugging
  redis:
    ports:
      - "6379:6379"

  # NestJS: montar codigo fuente para hot reload
  nestjs-api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: development
    deploy:
      replicas: 1   # Solo 1 replica en desarrollo
    ports:
      - "3000:3000"
    volumes:
      - ./apps/api/src:/app/src:ro
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pgbouncer:6543/${POSTGRES_DB}
      SUPABASE_URL: http://supabase-kong:8000
      LOG_LEVEL: debug
    command: ["node", "-r", "ts-node/register", "src/main.ts"]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api-dev.rule=PathPrefix(`/api`)"
      - "traefik.http.routers.api-dev.entrypoints=web"
      - "traefik.http.services.api-dev.loadbalancer.server.port=3000"

  worker:
    deploy:
      replicas: 1
    environment:
      NODE_ENV: development
      LOG_LEVEL: debug

  scheduler:
    environment:
      NODE_ENV: development
      LOG_LEVEL: debug
