version: "3.8"
# =================================================
# DUOCAFE - Infraestructura Compartida
# Un solo stack para los 3 ambientes (dev/testing/production)
#
# Levantar: docker compose -f docker-compose.infra.yml up -d
# Detener:  docker compose -f docker-compose.infra.yml down
# =================================================

services:

  # ── Traefik: reverse proxy para los 3 ambientes ─────
  traefik:
    image: traefik:v3.1
    container_name: duocafe-traefik
    command:
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=duocafe-infra"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--accesslog=true"
      - "--log.level=INFO"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-letsencrypt:/letsencrypt
    restart: unless-stopped
    networks:
      - duocafe-infra
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik-dash.rule=Host(`traefik.${DOMAIN}`)"
      - "traefik.http.routers.traefik-dash.entrypoints=websecure"
      - "traefik.http.routers.traefik-dash.tls.certresolver=letsencrypt"
      - "traefik.http.routers.traefik-dash.service=api@internal"
      - "traefik.http.routers.traefik-dash.middlewares=traefik-auth"
      - "traefik.http.middlewares.traefik-auth.basicauth.users=${TRAEFIK_DASHBOARD_AUTH}"
      # Middlewares reutilizables por todos los ambientes
      - "traefik.http.middlewares.security-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.security-headers.headers.frameDeny=true"
      - "traefik.http.middlewares.compress.compress=true"
      # Rate limit diferenciado por ambiente (prod más restrictivo)
      - "traefik.http.middlewares.rate-prod.ratelimit.average=100"
      - "traefik.http.middlewares.rate-prod.ratelimit.burst=50"
      - "traefik.http.middlewares.rate-dev.ratelimit.average=500"
      - "traefik.http.middlewares.rate-dev.ratelimit.burst=200"

  # ── PostgreSQL 15: base de datos compartida ──────────
  postgres:
    image: supabase/postgres:15.6.1.120
    container_name: duocafe-postgres
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./docker/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - duocafe-infra
    deploy:
      resources:
        limits:
          memory: 6G
          cpus: "2.0"

  # ── PgBouncer: connection pooling ────────────────────
  pgbouncer:
    image: bitnami/pgbouncer:1.22.1
    container_name: duocafe-pgbouncer
    environment:
      POSTGRESQL_HOST: postgres
      POSTGRESQL_PORT: 5432
      POSTGRESQL_USERNAME: postgres
      POSTGRESQL_PASSWORD: ${POSTGRES_PASSWORD}
      PGBOUNCER_DATABASE: "*"
      PGBOUNCER_POOL_MODE: transaction
      PGBOUNCER_MAX_CLIENT_CONN: 500
      PGBOUNCER_DEFAULT_POOL_SIZE: 20
      PGBOUNCER_AUTH_TYPE: scram-sha-256
    expose:
      - "5432"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - duocafe-infra
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"

  # ── Redis: cache y colas para los 3 ambientes ────────
  # DB 0 = production | DB 1 = testing | DB 2 = dev
  redis:
    image: redis:7.2-alpine
    container_name: duocafe-redis
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 1gb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec
      --databases 16
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - duocafe-infra
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "0.5"

networks:
  duocafe-infra:
    name: duocafe-infra
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  traefik-letsencrypt:
